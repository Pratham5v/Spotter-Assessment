[project]
name = "spotter-fuel-api"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
description = "Verified road itineraries and cost-conscious fuel purchases"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
