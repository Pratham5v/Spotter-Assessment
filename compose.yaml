services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_DB: spotter
      POSTGRES_USER: spotter
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spotter -d spotter"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql
  web:
    build: .
    command: ["sh", "scripts/start.sh"]
    env_file: .env
    environment:
      DB_HOST: db
      DB_USER: spotter
      DB_NAME: spotter
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data:/app/data
volumes:
  postgres_data:
